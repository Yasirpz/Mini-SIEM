{% extends "base.html" %}

{% block title %}Dashboard - Mini-SIEM{% endblock %}

{% block content %}
<section class="py-4">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Monitoring Status</h2>
        <button onclick="location.reload()" class="btn btn-sm btn-outline-secondary">Refresh view</button>
    </div>

    <!-- Populated by app/static/js/dashboard.js -->
    <div id="hostsContainer" class="list-group">
        <div class="text-center py-5 text-muted">
            <div class="spinner-border text-primary mb-2" role="status"></div>
            <p>Loading hosts...</p>
        </div>
    </div>

    <h3 class="mb-3 mt-4 text-danger">Detected Threats (SIEM)</h3>
    <div class="card shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-striped table-hover mb-0" id="alertsTable">
              <thead class="table-light">
                  <tr>
                      <th>Time</th>
                      <th>Host</th>
                      <th>Alert Type</th>
                      <th>Source IP</th>
                      <th>Message</th>
                      <th>Severity</th>
                  </tr>
              </thead>
              <tbody id="alertsBody">
                  <!-- Filled in by JS -->
                  <tr>
                      <td colspan="6" class="text-center py-3 text-muted">No alerts yet, or still loading.</td>
                  </tr>
              </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
