{% extends "base.html" %}

{% block title %}Alerts - Mini-SIEM{% endblock %}

{% block content %}
<section class="py-4">
  <div class="container">

    <div class="mb-4">
      <h2 class="mb-0">Alerts</h2>
      <small class="text-muted">
        Output of the rule-based detection engine (R-01 – R-04). Use the filters
        to narrow by severity, rule or host.
      </small>
    </div>

    <!-- ================= FILTERS ================= -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-6 col-md-2">
            <label class="form-label form-label-sm mb-1">Severity</label>
            <select id="filterSeverity" class="form-select form-select-sm">
              <option value="">All</option>
              <option value="HIGH">High</option>
              <option value="MEDIUM">Medium</option>
              <option value="LOW">Low</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label form-label-sm mb-1">Rule</label>
            <select id="filterRule" class="form-select form-select-sm">
              <option value="">All rules</option>
              <option value="R-01">R-01 Failed Login</option>
              <option value="R-02">R-02 Invalid User</option>
              <option value="R-03">R-03 Threat IP Match</option>
              <option value="R-04">R-04 Multiple Host Attempt</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label form-label-sm mb-1">Host</label>
            <select id="filterHost" class="form-select form-select-sm">
              <option value="">All hosts</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label form-label-sm mb-1">Status</label>
            <select id="filterAck" class="form-select form-select-sm">
              <option value="">All</option>
              <option value="false">Unreviewed</option>
              <option value="true">Reviewed</option>
            </select>
          </div>
          <div class="col-12 col-md-2 d-grid">
            <button id="applyFilters" class="btn btn-primary btn-sm">Apply</button>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="text-muted small" id="alertsCount">–</span>
      <button id="rerunDetection" class="btn btn-sm btn-outline-dark"
              title="Re-apply the detection rules to events already stored">
        Re-run detection
      </button>
    </div>

    <!-- ================= ALERT TABLE ================= -->
    <div class="card shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
              <tr>
                <th>Time</th>
                <th>Rule</th>
                <th>Host</th>
                <th>Type</th>
                <th>Source IP</th>
                <th>Message</th>
                <th>Severity</th>
                <th class="text-end">Action</th>
              </tr>
            </thead>
            <tbody id="alertsBody">
              <tr><td colspan="8" class="text-center py-3 text-muted">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <nav class="mt-3 d-flex justify-content-between align-items-center">
      <button id="prevPage" class="btn btn-sm btn-outline-secondary" disabled>&laquo; Previous</button>
      <span class="small text-muted" id="pageLabel"></span>
      <button id="nextPage" class="btn btn-sm btn-outline-secondary" disabled>Next &raquo;</button>
    </nav>

  </div>
</section>
{% endblock %}
